fidelity:
  divergences: >-
    (a) Statement 1 against Smiley's Theorem (1957, p. 428): the same
    hypotheses (an additive map of a ring onto a prime ring in which 2a = 0
    implies a = 0) and the same conclusion. Smiley's text does not define
    "prime ring"; the element-wise condition used here (for all x y, (for
    all z, x z y = 0) implies x = 0 or y = 0) is the definition in
    Herstein's paper (1956, p. 334) and is equivalent to the ideal-wise
    definition for associative rings, with or without identity; that
    equivalence is not formalized. The zero ring satisfies the condition,
    and there statement 1 is trivial. (b) The proof of statement 1 is not
    Smiley's. Relative to the source followed (Beidar-Bresar-Chebotar 2003,
    Proposition 3.1 with B_0 = B, A_0 = A): additive maps of rings in place
    of module homomorphisms of algebras over a ring containing 1/2, and "no
    2-torsion in the target" in place of 1/2 in the scalars. (c) Statement
    2 against Jacobson-Rickart's Theorem 2 (1950, p. 482): the same
    definition (squares and aba) and conclusion; "integral domain" is
    written out as "x y = 0 implies x = 0 or y = 0" for a ring that need
    not be commutative or have an identity (the zero ring satisfies this
    too, and there statement 2 is trivial); their Lemma 1 (attributed to
    Hua) is proved by a subgroup-covering argument, not their element
    chase. (d) A Jordan homomorphism in the sense of statement 1 into a
    ring without 2-torsion satisfies both identities of statement 2
    (library, not compared; Smiley p. 426 and Herstein p. 332 derive the
    same), so the two definitions agree there. (e) Statements 3-5 are
    existence statements; each asserts the failure of one hypothesis, the
    other hypotheses, and the failure of the conclusion. The witnesses are
    named in the Challenge docstring and defined in the library; they
    adapt the examples in the sources named in the alignment block:
    integer matrices in place of matrices over a field (statements 3 and
    4), the block-diagonal embedding added in statement 3, and a map F_2 x
    F_2 -> F_2 in place of an additive automorphism of a field of
    characteristic two (statement 5). (f) Statement 5's map preserves squares and does
    not satisfy the triple identity of statement 2, so it is not a
    counterexample to statement 6. (g)
    The three papers of 1950-1957 were read in text extractions of scanned
    PDFs (Internet Archive copies of the publisher's files); page numbers
    are the journal's. (h) The application paragraph is cited, not a
    theorem; no compared statement asserts it. (i) Statement 6 against
    Smiley's "Added in proof" (1957, p. 429): Smiley replaces hypothesis
    (1) by (1*), squares and aba, and keeps hypothesis (2), additivity and
    the Jordan identity; statement 6 assumes additivity and (1*) only,
    because the Jordan identity follows from the square identity. The zero
    ring satisfies the primeness condition, and there statement 6 is
    trivial. Statement 6 with the library lemmas map_sq_of_jordan and
    map_triple_of_jordan implies statement 1; statement 1 is kept as the
    classical form, with its own proof.

review:
  status: "self-assessed"
  reviewers:
    - "Stephanie Alexander"
  notes: >-
    The axioms of every compared declaration were printed, the Challenge
    and Solution statements were checked identical and the registry
    comparator was run locally (BUILD.txt). An AI-assisted scope review
    (Anthropic Claude, in Claude Code, under the author's direction) was
    applied to the plan before the build: it checked the identities of the
    proof symbolically, tested each hypothesis for necessity on finite
    examples, and found the prior formalization recorded above. An
    AI-assisted adversarial review (five lenses, each finding re-checked at
    source) was applied to the assembled package on 2026-11-10 and its
    findings were applied. The author reviewed statements 1-5 against
    their informal descriptions on 2026-11-10; they are unchanged since. A
    third AI-assisted check, organised by the registry's published review
    prompts, was applied to the public commit on 2026-11-10 and led to
    corrections of text and metadata only. Statement 6 was added after
    that and has not yet been reviewed by the author. Not peer-reviewed.

alignment:
  namespace: "JordanPrime"
  statements:
    - source: "Smiley 1957, Theorem (p. 428); contains Herstein 1956, Theorem H (p. 340)"
      lean: "JordanPrime.jordan_onto_prime"
      module: "Solution"
      status: "proved"
      note: "A Jordan homomorphism onto a prime ring without 2-torsion is multiplicative or anti-multiplicative."
    - source: "Jacobson-Rickart 1950, Theorem 2 (p. 482)"
      lean: "JordanPrime.twoIdentity_into_domain"
      module: "Solution"
      status: "proved"
      note: "An additive map preserving squares and aba into a ring without zero divisors is multiplicative or anti-multiplicative; every characteristic, no surjectivity."
    - source: "Standard example: the map A -> (A, A^t) (Bresar 2008, section 2, there over a field of characteristic not 2), composed here with the block-diagonal embedding; 2x2 integer instance"
      lean: "JordanPrime.onto_needed"
      module: "Solution"
      status: "proved"
      note: "Surjectivity is needed: a Jordan homomorphism that is not onto, into the 4x4 integer matrices (prime, no 2-torsion), and is neither."
    - source: "Standard example: (A_1, A_2) -> (A_1, A_2^T) (Havlicek, arXiv:2004.00886v2, footnote 17, there over a field and any n >= 2); 2x2 integer instance"
      lean: "JordanPrime.prime_needed"
      module: "Solution"
      status: "proved"
      note: "Primeness is needed: a Jordan homomorphism onto pairs of 2x2 integer matrices (not prime, no 2-torsion) that is neither."
    - source: "Standard observation: in characteristic 2 the identity holds trivially on commutative rings (Havlicek, arXiv:2004.00886v2, footnote 15, there for additive automorphisms of a commutative field); the instance F_2 x F_2 -> F_2 is written out here"
      lean: "JordanPrime.two_needed"
      module: "Solution"
      status: "proved"
      note: "The hypothesis on 2 is needed: a Jordan homomorphism from F_2 x F_2 onto F_2 (prime, with 2-torsion) that is neither."
    - source: "Smiley 1957, Added in proof (p. 429): the Theorem of p. 428 with (1*), squares and aba, in place of hypothesis (1) on 2"
      lean: "JordanPrime.twoIdentity_onto_prime"
      module: "Solution"
      status: "proved"
      note: "An additive map preserving squares and aba onto a prime ring is multiplicative or anti-multiplicative; no hypothesis on 2. The Jordan identity, which Smiley keeps as a hypothesis, is not assumed: it follows from the square identity."


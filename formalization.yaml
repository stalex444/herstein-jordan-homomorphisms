# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Herstein's theorem on Jordan homomorphisms onto prime rings, in Smiley's form for characteristic different from 2 and in his form for every characteristic, with the Jacobson-Rickart domain theorem and an example for each hypothesis"
  description: >-
    Kernel-checked proofs, in Lean 4 + Mathlib, of six statements. An
    additive map phi between associative rings is a Jordan homomorphism when
    phi(ab + ba) = phi(a)phi(b) + phi(b)phi(a). (1) A Jordan homomorphism onto
    a prime ring without 2-torsion is a homomorphism or an anti-homomorphism
    (phi(ab) = phi(b)phi(a)): Herstein's theorem (1956, Theorem H) in the
    form Smiley gave it (1957, p. 428), with characteristic 3 admitted; an
    additive map of rings, no identity assumed. (2) The domain form in every
    characteristic (Jacobson and Rickart 1950, Theorem 2): an additive map
    with phi(a^2) = phi(a)^2 and phi(aba) = phi(a)phi(b)phi(a), into a ring
    without zero divisors, is multiplicative or anti-multiplicative, with no
    surjectivity and no hypothesis on 2. (3)-(5) Each hypothesis of (1) is
    needed; each statement asserts that one hypothesis fails, that the others
    hold, and that the map is neither multiplicative nor anti-multiplicative:
    (3) from 2x2 into 4x4 integer matrices, not onto, the target prime and
    without 2-torsion (witness a -> diag(a, a^T)); (4) on pairs of 2x2
    integer matrices, onto, the target not prime (witness (a, b) ->
    (a, b^T)); (5) from F_2 x F_2 onto F_2, a prime ring with 2-torsion
    (witness (x, y) -> x + y). (6) The theorem in every characteristic
    (Smiley 1957, Added in proof, p. 429): an additive map with the two
    identities of (2), onto a prime ring, is a homomorphism or an
    anti-homomorphism, with no hypothesis on 2; it implies (1), and (5)
    shows that the Jordan identity alone does not suffice when the ring has
    2-torsion. The compared statements add no definition:
    the identities on the map and the conditions on the target ring are
    written out as universally quantified statements, the maps are
    Mathlib's AddMonoidHom, and onto is Function.Surjective. Statements 1,
    2 and 6 formalize theorems of the 1950s and statements 3-5 are standard
    examples; nothing here is a new theorem. The proof of (1) follows the
    argument written out by Beidar, Bresar and Chebotar (2003, Proposition
    3.1), not Smiley's; the proof of (2) is Jacobson and Rickart's; the
    proof of (6) is Smiley's, through his lemma that a prime ring in which
    every commutator squares to zero is commutative. Not formalized: the
    semiprime generalizations. A prior formalization of the case of
    complex-linear maps between unital complex algebras exists in
    github.com/openai/math and is recorded under related_formalizations;
    statements (1) and (6) contain that case. Application (cited; no compared statement asserts it): the
    self-adjoint elements of an algebra of observables are closed under the
    symmetrized product and not, in general, under the product; applied to
    the identity map, (1) says that on a prime ring without 2-torsion the
    symmetrized product determines the associative product up to reversing
    the order of the factors.
  authors:
    - "Stephanie Alexander"
  license: "MIT"
  responsible_maintainers:
    - "Stephanie Alexander"

classification:
  # math.RA / 16W10 (associative rings: Lie, Jordan and other nonassociative
  # structures on them), 16N60 (prime and semiprime associative rings), 17C50
  # (Jordan structures associated with other structures). math-ph and
  # quant-ph / 81R15 for the cited application (the Jordan product on
  # observables); no compared statement is a physical claim.
  arxiv: ["math.RA", "math-ph", "quant-ph"]
  msc2020: ["16W10", "16N60", "17C50", "81R15"]

sources:
  - title: "Jordan homomorphisms"
    authors:
      - "I. N. Herstein"
    id: "Transactions of the American Mathematical Society 81 (1956), no. 2, 331-341"
    # Bibliographic record Crossref-verified 2026-11-10: DOI
    # 10.1090/S0002-9947-1956-0076751-6. READ 2026-11-10 (pp. 331-334 and
    # Theorem H, p. 340; text extraction of the scan) in the Internet Archive
    # copy of the publisher's PDF,
    # web.archive.org/web/20250709135714/https://www.ams.org/journals/tran/1956-081-02/S0002-9947-1956-0076751-6/S0002-9947-1956-0076751-6.pdf
    type: "paper"
    location: "https://doi.org/10.1090/S0002-9947-1956-0076751-6"
    relationship: "formalizes"
    note: >-
      Scoped to statement 1. Herstein defines a Jordan homomorphism as an
      additive map of rings with phi(ab + ba) = phi(a)phi(b) + phi(b)phi(a)
      (p. 331), calls R' "not of characteristic 2" when 2x' = 0 implies
      x' = 0 (p. 332), defines a prime ring by "x'R'y' = (0) implies that
      either x'=0 or y'=0" (p. 334), and proves Theorem H (p. 340): a Jordan
      homomorphism of a ring onto a prime ring of characteristic different
      from 2 and 3 is a homomorphism or an anti-homomorphism. Statement 1
      uses the same definitions and does not exclude characteristic 3
      (Smiley, next source), so it contains Theorem H. Herstein's proof is
      not the one followed here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Jordan homomorphisms onto prime rings"
    authors:
      - "M. F. Smiley"
    id: "Transactions of the American Mathematical Society 84 (1957), no. 2, 426-429"
    # Bibliographic record Crossref-verified 2026-11-10: DOI
    # 10.1090/S0002-9947-1957-0083484-X. READ 2026-11-10 (the whole paper,
    # pp. 426-429; text extraction of the scan) in the Internet Archive copy
    # of the publisher's PDF,
    # web.archive.org/web/20231117102820/https://www.ams.org/journals/tran/1957-084-02/S0002-9947-1957-0083484-X/S0002-9947-1957-0083484-X.pdf
    type: "paper"
    location: "https://doi.org/10.1090/S0002-9947-1957-0083484-X"
    relationship: "formalizes"
    note: >-
      Scoped to statements 1 and 6. Statement 1 is the paper's Theorem
      (p. 428) as stated: a mapping of a ring R onto a prime ring R' with (1) 2a' = 0
      implies a' = 0 and (2) (ab + ba)' = a'b' + b'a', (a + b)' = a' + b'
      satisfies (ab)' = a'b' for all a, b or (ab)' = b'a' for all a, b. No
      identity element and no scalars are assumed. The identity proved in
      the library as HersteinJordan.defect_sandwich is Smiley's (7), p. 427,
      and tau * omega = 0 (defect_mul_defect) is derived on p. 426. The
      proof of statement 1 followed here after that identity is the one in
      Beidar-Bresar-Chebotar, not Smiley's. Statement 6 is the theorem as
      amended in the "Added in proof" (p. 429), where hypothesis (1) is
      replaced by (1*): (a^2)' = (a')^2 and (aba)' = a'b'a'. Divergence:
      Smiley keeps hypothesis (2), additivity and the Jordan identity,
      beside (1*); statement 6 assumes additivity and (1*) only, since the
      Jordan identity follows from the square identity
      (HersteinJordan.map_jordan_of_sq). The proof of statement 6 is
      Smiley's: identity (7), the three alternatives (11)-(13), and the
      Lemma of section 3, a prime ring in which every commutator squares to
      zero is commutative (HersteinJordan.commutative_of_commutator_sq_zero,
      proved following the paper). His linearized identities (8)-(10) are
      replaced by applying (7) and tau * omega = 0 to sums of pairs and
      subtracting. In alternative (13), where the paper says only that the
      proof is complete, the Lean concludes with the theorem behind
      statement 2.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Jordan superhomomorphisms"
    authors:
      - "K. I. Beidar"
      - "M. Brešar"
      - "M. A. Chebotar"
    id: "Communications in Algebra 31 (2003), no. 2, 633-644"
    # Crossref-verified 2026-11-10: DOI 10.1081/AGB-120017336. READ
    # 2026-11-10 in the author's copy at
    # https://users.fmf.uni-lj.si/bresar/documents/Jordansuperhom.pdf
    # (introduction and Proposition 3.1 with its proof).
    type: "paper"
    location: "https://doi.org/10.1081/AGB-120017336"
    relationship: "adapts"
    note: >-
      The proof of statement 1 follows this paper. Its Proposition 3.1 (with
      B_0 = B and A_0 = A; its hypothesis (iii), a A b A a = 0 implies a = 0
      or b = 0, is equivalent to primeness) is statement 1 for algebras over
      a commutative ring containing 1/2, with a complete proof that the
      authors describe as following Bresar 1989 and for whose key identity
      they cite Smiley's p. 427. Adapted here in two respects: additive maps
      of rings in place of module homomorphisms of algebras, and "no
      2-torsion in the target" in place of 1/2 in the scalars (a 2 is
      cancelled in deriving the square and triple identities, and again
      where the paper passes from x = -x to x = 0). The authors remark that
      their arguments also work in rings of characteristic not 2, and their
      algebras are not assumed to have an identity; no novelty is claimed
      for the ring-level form, which is the setting of Smiley's theorem.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Jordan homomorphisms of rings"
    authors:
      - "N. Jacobson"
      - "C. E. Rickart"
    id: "Transactions of the American Mathematical Society 69 (1950), 479-502"
    # Bibliographic record Crossref-verified 2026-11-10: DOI
    # 10.1090/S0002-9947-1950-0038335-X. READ 2026-11-10 (pp. 479-483; text
    # extraction of the scan) in the Internet Archive copy of the
    # publisher's PDF,
    # web.archive.org/web/20250418165034/https://www.ams.org/journals/tran/1950-069-00/S0002-9947-1950-0038335-X/S0002-9947-1950-0038335-X.pdf
    type: "paper"
    location: "https://doi.org/10.1090/S0002-9947-1950-0038335-X"
    relationship: "formalizes"
    note: >-
      Scoped to statement 2, which is the paper's Theorem 2 (p. 482): a
      Jordan homomorphism of a ring into an integral domain is a
      homomorphism or an anti-homomorphism, with the paper's definition
      (p. 479): additive maps with (a^2)^J = (a^J)^2 and (aba)^J =
      a^J b^J a^J. No surjectivity and no hypothesis on 2. The paper
      introduces Theorem 2 as generalizing Hua's theorem on division rings,
      so its integral domains are not assumed commutative; statement 2
      writes the hypothesis out as "x y = 0 implies x = 0 or y = 0". The
      proof is the paper's: its identity (7) is
      HersteinJordan.defect_mul_defect, and the step from each pair to all
      pairs is its Lemma 1, attributed there to Hua, proved here by a
      subgroup-covering argument. The paper's "sum" of Jordan homomorphisms
      (p. 479) is the construction behind the examples of statements 3 and
      4.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Jordan homomorphisms revisited"
    authors:
      - "M. Brešar"
    id: "Mathematical Proceedings of the Cambridge Philosophical Society 144 (2008), no. 2, 317-328"
    # Crossref-verified 2026-11-10: DOI 10.1017/S0305004107000825. READ
    # 2026-11-10 (introduction, the opening of section 2, the remark on
    # Kadison and Stormer in section 5, reference list) in the author's copy
    # at https://users.fmf.uni-lj.si/bresar/documents/Jordanhomrev.pdf
    type: "paper"
    location: "https://doi.org/10.1017/S0305004107000825"
    relationship: "adapts"
    note: >-
      Scoped to statement 3: its section 2 gives the map A -> (A, A^t) from
      M_n(F) to M_n(F) x M_n(F) as a sum of a homomorphism and an
      antihomomorphism; statement 3's witness is that map for 2x2 integer
      matrices, composed with the block-diagonal embedding into the 4x4
      matrices so that the target is prime. Also read for its introduction,
      the source of the remarks on Kadison used in this entry.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Germán Ancochea's work on projectivities, harmonicity preservers and semi-homomorphisms"
    authors:
      - "H. Havlicek"
    id: "arXiv:2004.00886v2"
    # READ 2026-11-10 (version 2: section 3 with footnotes 15 and 17, and
    # section 4.2).
    type: "paper"
    location: "https://arxiv.org/abs/2004.00886"
    relationship: "adapts"
    note: >-
      Scoped to statements 4 and 5. Footnote 17 gives the map (A_1, A_2) ->
      (A_1, A_2^T) of M_n(F) + M_n(F) onto itself, n >= 2, F a commutative
      field, as a map that is neither a homomorphism nor an
      anti-homomorphism; statement 4 is that map for 2x2 integer matrices. Footnote
      15 notes that an additive automorphism of a commutative field of
      characteristic two satisfies the identity of statement 1 trivially;
      statement 5 is an instance of that degeneracy, F_2 x F_2 -> F_2,
      written out here.
      Section 4.2 is the history used in this entry: Hua, Jacobson-Rickart,
      Herstein (characteristic greater than three), Yamaguti, Smiley
      (characteristic three, and characteristic two with the two-identity
      definition, which Havlicek calls Kaplansky's), Baxter-Martindale and
      Bresar (semiprime rings).
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Jordan mappings of semiprime rings"
    authors:
      - "M. Brešar"
    id: "Journal of Algebra 127 (1989), 218-228"
    # Crossref-verified 2026-11-10: DOI 10.1016/0021-8693(89)90285-8. NOT
    # READ. Cited by Beidar-Bresar-Chebotar as the argument their
    # Proposition 3.1 follows.
    type: "paper"
    location: "https://doi.org/10.1016/0021-8693(89)90285-8"
    relationship: "background"
    note: >-
      Origin of the proof route as reported by Beidar-Bresar-Chebotar; the
      semiprime generalization it proves is not formalized here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Jordan homomorphisms of semiprime rings"
    authors:
      - "W. E. Baxter"
      - "W. S. Martindale 3rd"
    id: "Journal of Algebra 56 (1979), 457-471"
    # Crossref-verified 2026-11-10: DOI 10.1016/0021-8693(79)90349-1. NOT READ.
    type: "paper"
    location: "https://doi.org/10.1016/0021-8693(79)90349-1"
    relationship: "background"
    note: "Named only as a generalization (semiprime targets) that is not formalized here. Not read; the generalization is as reported in Havlicek's section 4.2."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On an algebraic generalization of the quantum mechanical formalism"
    authors:
      - "P. Jordan"
      - "J. von Neumann"
      - "E. Wigner"
    id: "Annals of Mathematics 35 (1934), 29-64"
    # Crossref-verified 2026-11-10: DOI 10.2307/1968117. NOT READ; standard
    # reference for the symmetrized product on observables.
    type: "paper"
    location: "https://doi.org/10.2307/1968117"
    relationship: "background"
    note: "The cited application only: observables with the symmetrized product. Not used in any proof. Not read; cited as the standard reference."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Isometries of operator algebras"
    authors:
      - "R. V. Kadison"
    id: "Annals of Mathematics 54 (1951), 325-338"
    # Crossref-verified 2026-11-10: DOI 10.2307/1969534. NOT READ; cited as
    # Bresar's introduction reports it.
    type: "paper"
    location: "https://doi.org/10.2307/1969534"
    relationship: "background"
    note: >-
      Named only in the not-formalized list. Bresar's introduction reports
      that Kadison used the Jacobson-Rickart matrix theorem to show that a
      Jordan *-homomorphism from a W*-algebra onto a C*-algebra is the sum
      of a *-homomorphism and a *-antihomomorphism. That is a different
      result from statement 1 and is not formalized here.
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Jordan homomorphisms: A survey"
    authors:
      - "M. Brešar"
      - "E. Zelmanov"
    id: "Serdica Mathematical Journal 51 (2025), no. 3-4, 203-230"
    # Crossref and publisher page checked 2026-11-10: DOI
    # 10.55630/serdica.2025.51.203-230 (the publisher's record misprints
    # the title). READ 2026-11-10 as arXiv:2510.16876v1 (the opening of the
    # introduction and section 5); the journal version was not read.
    type: "paper"
    location: "https://doi.org/10.55630/serdica.2025.51.203-230"
    relationship: "background"
    note: >-
      Current survey of the subject. In arXiv:2510.16876v1, for algebras
      over a field of characteristic not 2, Theorem 5.3 is the
      Jacobson-Rickart theorem for maps into a domain and Theorem 5.6 is
      Herstein's theorem, with the remark that Smiley removed the hypothesis
      on characteristic 3; the proofs of both are sketched there. Read as
      the arXiv version, not the journal version. Not used in any proof
      here.
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "Splittable Jordan homomorphisms and commutator ideals"
    authors:
      - "M. Brešar"
    id: "Journal of Algebra 671 (2025), 159-180"
    # Crossref-verified 2026-11-10: DOI 10.1016/j.jalgebra.2025.03.007. READ
    # 2026-11-10 as arXiv:2410.07052v1 (the first two pages of the
    # introduction; Proposition 3.4 and the remark after it); the journal
    # version was not read.
    type: "paper"
    location: "https://doi.org/10.1016/j.jalgebra.2025.03.007"
    relationship: "background"
    note: >-
      Recent paper on the subject. In arXiv:2410.07052v1 the introduction
      lists Herstein's theorem among the classical results and says that
      these results and their generalizations are still relevant because
      Jordan homomorphisms occur in various problems, preserver problems in
      particular. After Proposition 3.4 (a surjective Jordan homomorphism
      onto a 2-torsion-free semiprime ring is splittable; attributed there
      to Bresar 1989) it notes that the proposition covers Herstein's
      theorem. Read as the arXiv version, not the journal version. Not used
      in any proof here.
    license: "unknown"
    author_endorsement: "not-contacted"

related_formalizations:
  - id: "https://github.com/openai/math/blob/4eaee87548250b2682affda7d05d947c05554bae/lean/OAI/Analysis/KadisonKastler/Jordan.lean"
    relationship: "other"
    note: >-
      PRIOR FORMALIZATION OF A SPECIAL CASE OF STATEMENT 1. The file is
      lean/OAI/Analysis/KadisonKastler/Jordan.lean in github.com/openai/math,
      read on 2026-11-10 at commit 4eaee87548250b2682affda7d05d947c05554bae
      (file sha256
      f7ba1d007eb1b6e887c61a1d0eb589bf9595162568adc58a8c98ff0f73e7a6a9; the
      file's only commit is dated 2026-10-06). Its theorem
      OAI.KadisonKastler.PreservesJordan.multiplicative_or_antimultiplicative,
      described there as "Herstein's orientation theorem in the complex
      prime-target case", proves the conclusion of statement 1 for a
      surjective complex-linear map between unital complex algebras whose
      target is prime in the same universally quantified form. Statement 1
      here contains that case and is free of three restrictions: the maps
      are additive (no scalars), the rings need not have an identity, and "2
      is invertible" is replaced by "no 2-torsion". The same file proves,
      for complex-linear maps, the square, triple-product and linearized
      triple-product identities and the defect relation (with
      surjectivity); the library lemmas map_sq_of_jordan,
      map_triple_of_jordan, map_triple_lin and defect_sandwich are their
      ring-level counterparts. Statement 6 (the two-identity form onto a
      prime ring, with no hypothesis on 2) contains the same complex case
      and is not there in any other form: the file works with complex-linear
      maps throughout. Statements 2-5 (the domain form and the
      three examples) were not found in that repository: on 2026-11-10, at
      the commit above, all of its files were searched by name and by
      content for the Jordan identity, the homomorphism-or-anti-homomorphism
      conclusion, the definitions PreservesJordan and IsPrimeAlgebra, and
      the words Herstein, antimultiplicative and anti-homomorphism; the
      only matches on this subject are in the Kadison-Kastler files, which
      use the complex-linear theorem and contain no domain form, no
      two-identity form, no counterexample and no version for additive
      maps. Contact with the OpenAI file: the proof plan (five steps, from
      Beidar-Bresar-Chebotar Proposition 3.1) was written before the file
      was found. An AI-assisted scope review then found the file, read all
      of it, and compiled a scratch check modelled on it; that scratch is
      not part of this repository and was not opened when the Lean in this
      entry was written. Before writing that Lean, the drafting session
      read the scope review's report and lines 1-40 and 150-182 of the file
      (the header, the two definitions, the halving lemma, the statement of
      the squares lemma, the end of a private definition, and the main
      theorem with all but the last line of its proof, which ends at line
      183). The rest of the file was read after the
      build, for this note. Both developments follow the same classical
      argument (squares, triple product, linearized triple product, defect
      relation, covering). The Lean here differs in the two-identity
      factoring, the lemma tau * omega = 0 and the domain form (absent
      there), the last step (tau x omega y tau = 0 here, tau x omega y
      omega = 0 there), the covering lemma and the tactics. No code was
      copied. The relationship is recorded as "other" and not as
      "independent" because of that contact.
  - id: "https://github.com/abderrahim-lectures/braided-sym-deriv/tree/b14553ed8bde9173783266047bca7dd5a79bdba8"
    relationship: "other"
    note: >-
      ADJACENT, NOT THIS THEOREM. A Lean 4 development, read on 2026-11-10
      at commit b14553ed8bde9173783266047bca7dd5a79bdba8 (dated 2026-11-04).
      It formalizes Jordan derivations (Bresar 1988
      Theorem 1; Herstein 1957, "Jordan derivations of prime rings"; Cusack
      1975), not Jordan homomorphisms. Overlaps: it defines prime, semiprime
      and 2-torsion-free rings in the same universally quantified form used
      here (there for rings with identity), and its lemma bresar_lemma4 is a
      semiprime relative of the last step of statement 1 (from tau x omega +
      omega x tau = 0 for all x, the library here derives tau x omega y tau
      = 0 and applies primeness twice). No statement or module is shared.
  - id: "https://github.com/MColbrook/Proof-of-the-spectral-isometry-conjecture-for-C-star-algebras"
    relationship: "other"
    note: >-
      ADJACENT, NOT THIS THEOREM. Registry record PALOMAR-2026-10-28-000031,
      read on 2026-11-10. It proves that unital surjective spectral
      isometries of C*-algebras are Jordan isomorphisms (complex-linear
      bijections preserving squares), and, in its library, that
      complex-linear Jordan derivations of semiprime complex algebras are
      derivations. It contains no statement that a Jordan homomorphism is a
      homomorphism or an anti-homomorphism. No statement or module is
      shared.
  - id: "https://github.com/leanprover-community/mathlib4"
    relationship: "builds-on"
    note: >-
      Mathlib declarations used in this repository include NonUnitalRing,
      AddMonoidHom, Matrix, Matrix.fromBlocks, Matrix.single and ZMod. The
      compared statements use Mathlib vocabulary only; no definition is
      added. Mathlib at the pin has no Jordan-homomorphism declaration and no
      prime-ring predicate for noncommutative rings, which is why the
      hypotheses are written out. Mathlib's Algebra/Jordan/Basic.lean
      (IsJordan, IsCommJordan) concerns Jordan identities of a multiplication
      on one type, and SymAlg (Algebra/Symmetrized.lean) carries the product
      (ab + ba)/2 and needs 2 invertible; neither is used.

status:
  scope: >-
    Formalized: six compared theorems, in comparator order, namespace
    JordanPrime (see the description for their content). Proved in the
    repository, not compared: the two-identity form of statement 1, still
    assuming no 2-torsion
    (HersteinJordan.mul_or_antimul_of_prime_of_twoIdentity); the passage
    from the Jordan identity to the two identities in a ring without
    2-torsion (map_sq_of_jordan, map_triple_of_jordan); the identities
    tau * omega = 0 (defect_mul_defect) and tau * phi(r) * omega + omega *
    phi(r) * tau = 0 (defect_sandwich), valid for the two-identity definition
    with no hypothesis on 2 or on the target; the covering lemma
    (biadditive_cover); primeness of a matrix ring over a prime ring with
    identity (matrix_prime); and the corollary for Jordan homomorphisms onto
    such a matrix ring (mul_or_antimul_onto_matrix); Smiley's lemma that a
    prime ring in which every commutator squares to zero is commutative
    (commutative_of_commutator_sq_zero, with the commutator as the library
    definition ringComm); and omega * tau = 0 (defect_mul_defect_mirror).
    Not formalized: semiprime targets (Baxter-Martindale 1979;
    Bresar 1989); the sum-of-a-homomorphism-and-an-antihomomorphism theorems
    for matrix rings and operator algebras (Jacobson-Rickart; Kadison); any
    statement about *-preserving maps.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]

automation:
  methods:
    - method: "agent"
      models: ["Anthropic Claude (Fable-class, 2026)"]
      framework: "Claude Code"
      tool_setup: >-
        AI-assisted scoping, literature and prior-formalization search,
